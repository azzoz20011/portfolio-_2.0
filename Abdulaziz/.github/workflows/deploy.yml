
name: Portfolio CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Build completed
        run: echo "Portfolio build successful!"

      - name: Test HTTPS connection
        run: |
          curl --fail --silent --show-error \
            --location \
            --output /dev/null \
            --write-out "HTTP Status: %{http_code}\nSSL Verify: %{ssl_verify_result}\n" \
            https://azzoz2001.com/


      


